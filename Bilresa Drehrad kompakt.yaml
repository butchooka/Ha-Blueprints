---
blueprint:
  name: Bilresa Drehrad kompakt
  description: |
    Kompakter Blueprint für das **IKEA BILRESA Drehrad** (Matter, 3 Kanäle).

    Pro Kanal wird ein Ziel gewählt (Lampe, Media-Player, Gerät oder Bereich).
    Das Drehrad regelt automatisch die **Helligkeit** (Lampen) oder die
    **Lautstärke** (Media-Player). Enthält das Ziel beides, haben Lampen Vorrang.

    - Einfachklick: Ziel **AN** (änderbar)
    - Doppelklick: Ziel **AUS** (änderbar)
    - Dreifachklick und langer Druck: frei belegbar
    - Drehen kann ein- und ausschalten (abschaltbar)

    Für die Auswertung „Sofort“ müssen die 9 versteckten Sensor-Entitäten des
    Drehrads aktiviert sein (Gerät → Entitäten → „deaktivierte Entitäten“).

    Version: 2026-11-12f – basiert auf „Ikea_bilresa_scroll_wheel“ von jhol-byte
    (https://community.home-assistant.io/t/965365)
  domain: automation
  homeassistant:
    min_version: 2025.4.0

  input:
    remote:
      name: Drehrad
      description: IKEA BILRESA Drehrad (Matter)
      selector:
        device:
          filter:
            manufacturer: IKEA of Sweden
            model: BILRESA scroll wheel
            integration: matter


    # ---------------------------------------------------------------- Kanal 1
    channel1_section:
      name: Kanal 1
      icon: mdi:numeric-1-circle-outline
      collapsed: true
      input:
        target_ch1:
          name: "Kanal 1: Ziel"
          description: >-
            Lampe(n), Media-Player, Gerät oder Bereich, das dieser Kanal steuert.
            Leer lassen, wenn der Kanal nur eigene Aktionen ausführen soll.
          default: {}
          selector:
            target:
              entity:
                - domain:
                    - light
                    - media_player
        wheel_mode_ch1:
          name: "Kanal 1: Funktion des Drehrads"
          description: >-
            „Automatisch“ wählt nach dem Ziel: Lampe → Helligkeit,
            Media-Player → Lautstärke.
          default: auto
          selector:
            select:
              mode: dropdown
              options:
                - label: Automatisch (nach Ziel)
                  value: auto
                - label: "Licht: Helligkeit"
                  value: light
                - label: "Media: Lautstärke"
                  value: media
                - label: Eigene Dreh-Aktion
                  value: custom
        click_mode_ch1:
          name: "Kanal 1: Einfachklick"
          default: turn_on
          selector:
            select:
              mode: dropdown
              options:
                - label: Ziel einschalten (AN)
                  value: turn_on
                - label: Ziel ausschalten (AUS)
                  value: turn_off
                - label: Ziel umschalten
                  value: toggle
                - label: Eigene Aktion
                  value: custom
        click_action_ch1:
          name: "Kanal 1: Einfachklick – eigene Aktion"
          description: Nur bei „Eigene Aktion“. Leer = keine Aktion.
          default: []
          selector:
            action: {}
        double_mode_ch1:
          name: "Kanal 1: Doppelklick"
          default: turn_off
          selector:
            select:
              mode: dropdown
              options:
                - label: Ziel einschalten (AN)
                  value: turn_on
                - label: Ziel ausschalten (AUS)
                  value: turn_off
                - label: Ziel umschalten
                  value: toggle
                - label: Eigene Aktion
                  value: custom
        double_action_ch1:
          name: "Kanal 1: Doppelklick – eigene Aktion"
          description: Nur bei „Eigene Aktion“. Leer = keine Aktion.
          default: []
          selector:
            action: {}
        triple_action_ch1:
          name: "Kanal 1: Dreifachklick"
          description: Frei belegbare Aktion.
          default: []
          selector:
            action: {}
        long_action_ch1:
          name: "Kanal 1: Langer Druck"
          description: Frei belegbare Aktion (einmalig beim Halten).
          default: []
          selector:
            action: {}
        wheel_action_ch1:
          name: "Kanal 1: Eigene Dreh-Aktion"
          description: |
            Nur bei Funktion „Eigene Dreh-Aktion“. Verfügbare Variablen:
            - `scroll_direction`: 'left' oder 'right'
            - `scroll_clicks`: Anzahl Rasterschritte (bei „Sofort“ immer 1)
          default: []
          selector:
            action: {}


    # ---------------------------------------------------------------- Kanal 2
    channel2_section:
      name: Kanal 2
      icon: mdi:numeric-2-circle-outline
      collapsed: true
      input:
        target_ch2:
          name: "Kanal 2: Ziel"
          description: >-
            Lampe(n), Media-Player, Gerät oder Bereich, das dieser Kanal steuert.
            Leer lassen, wenn der Kanal nur eigene Aktionen ausführen soll.
          default: {}
          selector:
            target:
              entity:
                - domain:
                    - light
                    - media_player
        wheel_mode_ch2:
          name: "Kanal 2: Funktion des Drehrads"
          description: >-
            „Automatisch“ wählt nach dem Ziel: Lampe → Helligkeit,
            Media-Player → Lautstärke.
          default: auto
          selector:
            select:
              mode: dropdown
              options:
                - label: Automatisch (nach Ziel)
                  value: auto
                - label: "Licht: Helligkeit"
                  value: light
                - label: "Media: Lautstärke"
                  value: media
                - label: Eigene Dreh-Aktion
                  value: custom
        click_mode_ch2:
          name: "Kanal 2: Einfachklick"
          default: turn_on
          selector:
            select:
              mode: dropdown
              options:
                - label: Ziel einschalten (AN)
                  value: turn_on
                - label: Ziel ausschalten (AUS)
                  value: turn_off
                - label: Ziel umschalten
                  value: toggle
                - label: Eigene Aktion
                  value: custom
        click_action_ch2:
          name: "Kanal 2: Einfachklick – eigene Aktion"
          description: Nur bei „Eigene Aktion“. Leer = keine Aktion.
          default: []
          selector:
            action: {}
        double_mode_ch2:
          name: "Kanal 2: Doppelklick"
          default: turn_off
          selector:
            select:
              mode: dropdown
              options:
                - label: Ziel einschalten (AN)
                  value: turn_on
                - label: Ziel ausschalten (AUS)
                  value: turn_off
                - label: Ziel umschalten
                  value: toggle
                - label: Eigene Aktion
                  value: custom
        double_action_ch2:
          name: "Kanal 2: Doppelklick – eigene Aktion"
          description: Nur bei „Eigene Aktion“. Leer = keine Aktion.
          default: []
          selector:
            action: {}
        triple_action_ch2:
          name: "Kanal 2: Dreifachklick"
          description: Frei belegbare Aktion.
          default: []
          selector:
            action: {}
        long_action_ch2:
          name: "Kanal 2: Langer Druck"
          description: Frei belegbare Aktion (einmalig beim Halten).
          default: []
          selector:
            action: {}
        wheel_action_ch2:
          name: "Kanal 2: Eigene Dreh-Aktion"
          description: |
            Nur bei Funktion „Eigene Dreh-Aktion“. Verfügbare Variablen:
            - `scroll_direction`: 'left' oder 'right'
            - `scroll_clicks`: Anzahl Rasterschritte (bei „Sofort“ immer 1)
          default: []
          selector:
            action: {}


    # ---------------------------------------------------------------- Kanal 3
    channel3_section:
      name: Kanal 3
      icon: mdi:numeric-3-circle-outline
      collapsed: true
      input:
        target_ch3:
          name: "Kanal 3: Ziel"
          description: >-
            Lampe(n), Media-Player, Gerät oder Bereich, das dieser Kanal steuert.
            Leer lassen, wenn der Kanal nur eigene Aktionen ausführen soll.
          default: {}
          selector:
            target:
              entity:
                - domain:
                    - light
                    - media_player
        wheel_mode_ch3:
          name: "Kanal 3: Funktion des Drehrads"
          description: >-
            „Automatisch“ wählt nach dem Ziel: Lampe → Helligkeit,
            Media-Player → Lautstärke.
          default: auto
          selector:
            select:
              mode: dropdown
              options:
                - label: Automatisch (nach Ziel)
                  value: auto
                - label: "Licht: Helligkeit"
                  value: light
                - label: "Media: Lautstärke"
                  value: media
                - label: Eigene Dreh-Aktion
                  value: custom
        click_mode_ch3:
          name: "Kanal 3: Einfachklick"
          default: turn_on
          selector:
            select:
              mode: dropdown
              options:
                - label: Ziel einschalten (AN)
                  value: turn_on
                - label: Ziel ausschalten (AUS)
                  value: turn_off
                - label: Ziel umschalten
                  value: toggle
                - label: Eigene Aktion
                  value: custom
        click_action_ch3:
          name: "Kanal 3: Einfachklick – eigene Aktion"
          description: Nur bei „Eigene Aktion“. Leer = keine Aktion.
          default: []
          selector:
            action: {}
        double_mode_ch3:
          name: "Kanal 3: Doppelklick"
          default: turn_off
          selector:
            select:
              mode: dropdown
              options:
                - label: Ziel einschalten (AN)
                  value: turn_on
                - label: Ziel ausschalten (AUS)
                  value: turn_off
                - label: Ziel umschalten
                  value: toggle
                - label: Eigene Aktion
                  value: custom
        double_action_ch3:
          name: "Kanal 3: Doppelklick – eigene Aktion"
          description: Nur bei „Eigene Aktion“. Leer = keine Aktion.
          default: []
          selector:
            action: {}
        triple_action_ch3:
          name: "Kanal 3: Dreifachklick"
          description: Frei belegbare Aktion.
          default: []
          selector:
            action: {}
        long_action_ch3:
          name: "Kanal 3: Langer Druck"
          description: Frei belegbare Aktion (einmalig beim Halten).
          default: []
          selector:
            action: {}
        wheel_action_ch3:
          name: "Kanal 3: Eigene Dreh-Aktion"
          description: |
            Nur bei Funktion „Eigene Dreh-Aktion“. Verfügbare Variablen:
            - `scroll_direction`: 'left' oder 'right'
            - `scroll_clicks`: Anzahl Rasterschritte (bei „Sofort“ immer 1)
          default: []
          selector:
            action: {}


    # ------------------------------------------------- Globale Einstellungen
    wheel_section:
      name: Drehrad (alle Kanäle)
      icon: mdi:rotate-360
      collapsed: true
      input:
        eval_mode:
          name: Auswertung des Drehrads
          description: |
            - **Sofort**: reagiert ohne Verzögerung, solange gedreht wird. Geregelt
              wird nach Drehdauer (Einstellung „Sofort: Drehdauer …“). Nutzt die
              versteckten Sensor-Entitäten (müssen am Gerät aktiviert sein).
            - **Entspannt**: eine Aktion nach dem Drehen mit der vom Rad gezählten
              Schrittzahl; hier gilt „Umdrehungen für 0–100 %“. Benötigt die
              Ereignis-Entitäten „Taste“ des Rads.
          default: instant
          selector:
            select:
              options:
                - label: Sofort (nach Drehdauer)
                  value: instant
                - label: Entspannt (nach Rasterschritten)
                  value: relaxed
        clicks_per_turn:
          name: "Entspannt: Rasterschritte pro Umdrehung"
          description: >-
            Anzahl der Rasterschritte, die das Rad bei einer vollen Umdrehung
            meldet. Wert anpassen, falls 0–100 % nicht genau zur gewählten
            Anzahl Umdrehungen passt.
          default: 18
          selector:
            number:
              min: 4
              max: 60
              step: 1
              mode: box

    light_section:
      name: Licht (alle Kanäle)
      icon: mdi:lightbulb-on-outline
      collapsed: true
      input:
        light_turns:
          name: "Entspannt: Umdrehungen für 0 % bis 100 % Helligkeit"
          default: "1"
          selector:
            select:
              options:
                - label: 1 volle Umdrehung
                  value: "1"
                - label: 2 volle Umdrehungen
                  value: "2"
        light_ramp_time:
          name: "Sofort: Drehdauer für 0 % bis 100 %"
          description: >-
            Nur bei Auswertung „Sofort“: so lange muss gedreht werden, um die
            Helligkeit einmal über den ganzen Bereich zu bewegen.
          default: 1.5
          selector:
            number:
              min: 0.3
              max: 10
              step: 0.1
              unit_of_measurement: s
              mode: box
        light_turn_on:
          name: Drehen schaltet Licht ein
          description: Rechtsdrehen schaltet ausgeschaltete Lampen (dunkel beginnend) ein.
          default: true
          selector:
            boolean:
        light_turn_off:
          name: Drehen schaltet Licht aus
          description: Linksdrehen unter die kleinste Helligkeit schaltet die Lampen aus.
          default: true
          selector:
            boolean:
        light_transition:
          name: Übergangszeit
          description: Dauer der Helligkeitsübergänge in Sekunden.
          default: 0.3
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: s
              mode: box

    media_section:
      name: Media (alle Kanäle)
      icon: mdi:volume-high
      collapsed: true
      input:
        media_turns:
          name: "Entspannt: Umdrehungen für 0 % bis maximale Lautstärke"
          default: "1"
          selector:
            select:
              options:
                - label: 1 volle Umdrehung
                  value: "1"
                - label: 2 volle Umdrehungen
                  value: "2"
        media_ramp_time:
          name: "Sofort: Drehdauer für 0 bis maximale Lautstärke"
          description: >-
            Nur bei Auswertung „Sofort“: so lange muss gedreht werden, um die
            Lautstärke einmal über den ganzen Bereich zu bewegen.
          default: 1.5
          selector:
            number:
              min: 0.3
              max: 10
              step: 0.1
              unit_of_measurement: s
              mode: box
        volume_max_pct:
          name: Maximale Lautstärke
          description: Lauter als dieser Wert stellt das Drehrad nicht ein.
          default: 40
          selector:
            number:
              min: 5
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        media_turn_on:
          name: Drehen schaltet Media-Player ein
          description: Rechtsdrehen schaltet ausgeschaltete Media-Player ein.
          default: true
          selector:
            boolean:
        media_turn_off:
          name: Drehen schaltet Media-Player aus
          description: Linksdrehen unter Lautstärke 0 schaltet die Media-Player aus.
          default: true
          selector:
            boolean:


trigger:

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_ch1 }}"
    id: button_ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_left_ch1 }}"
    id: left_ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_right_ch1 }}"
    id: right_ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_left_ext_ch1 }}"
    id: left_ext_ch1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_right_ext_ch1 }}"
    id: right_ext_ch1

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_ch2 }}"
    id: button_ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_left_ch2 }}"
    id: left_ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_right_ch2 }}"
    id: right_ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_left_ext_ch2 }}"
    id: left_ext_ch2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_right_ext_ch2 }}"
    id: right_ext_ch2

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_ch3 }}"
    id: button_ch3
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_left_ch3 }}"
    id: left_ch3
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_right_ch3 }}"
    id: right_ch3
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_left_ext_ch3 }}"
    id: left_ext_ch3
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_scroll_right_ext_ch3 }}"
    id: right_ext_ch3


condition:
  - condition: template
    value_template: >-
      {{ trigger.event.data.old_state is not none
         and trigger.event.data.new_state is not none
         and trigger.event.data.old_state.state != 'unavailable'
         and trigger.event.data.new_state.state != 'unavailable' }}

action:
  - variables:
      channel: "{{ trigger.id[-3:] }}"
      is_button: "{{ trigger.id.startswith('button') }}"
      is_ext: "{{ '_ext_' in trigger.id }}"
      event_type: "{{ trigger.event.data.new_state.attributes.event_type | default('') }}"
      # Ziel (Entität, Gerät, Bereich, Etage, Label) in Entitäten auflösen
      entities: >-
        {% set t = cfg[channel]['target'] %}
        {% set ns = namespace(e=[]) %}
        {% if t is mapping %}
          {% for key in ['entity_id', 'device_id', 'area_id', 'floor_id', 'label_id'] %}
            {% set x = t.get(key) or [] %}
            {% for i in ([x] if x is string else x) %}
              {% if key == 'entity_id' %}
                {% set ns.e = ns.e + [i] %}
              {% elif key == 'device_id' %}
                {% set ns.e = ns.e + device_entities(i) | list %}
              {% elif key == 'area_id' %}
                {% set ns.e = ns.e + area_entities(i) | list %}
              {% elif key == 'floor_id' %}
                {% for a in floor_areas(i) %}
                  {% set ns.e = ns.e + area_entities(a) | list %}
                {% endfor %}
              {% else %}
                {% set ns.e = ns.e + label_entities(i) | list %}
              {% endif %}
            {% endfor %}
          {% endfor %}
        {% endif %}
        {{ ns.e | unique | list }}
      lights: >-
        {{ entities | select('match', 'light\.') | list }}
      players: >-
        {{ entities | select('match', 'media_player\.') | list }}
      wheel_mode: "{{ cfg[channel]['wheel'] }}"
      # Lampen haben Vorrang, wenn das Ziel beides enthält
      func: >-
        {% if wheel_mode in ['light', 'media'] %}
          {{ wheel_mode }}
        {% elif lights | count > 0 %}
          light
        {% elif players | count > 0 %}
          media
        {% else %}
          none
        {% endif %}

  - choose:
      # ------------------------------------------------------ Einfachklick
      - conditions: "{{ is_button and event_type == 'multi_press_1' }}"
        sequence:
          - variables:
              mode: "{{ cfg[channel]['click'] }}"
          - choose:
              - conditions: "{{ mode == 'custom' }}"
                sequence:
                  - if: "{{ channel == 'ch1' }}"
                    then: !input click_action_ch1
                  - if: "{{ channel == 'ch2' }}"
                    then: !input click_action_ch2
                  - if: "{{ channel == 'ch3' }}"
                    then: !input click_action_ch3
              - conditions: "{{ func == 'light' }}"
                sequence:
                  - action: "light.{{ mode }}"
                    target:
                      entity_id: "{{ lights }}"
              - conditions: "{{ func == 'media' }}"
                sequence:
                  - action: "media_player.{{ mode }}"
                    continue_on_error: true
                    target:
                      entity_id: "{{ players }}"

      # -------------------------------------------------------- Doppelklick
      - conditions: "{{ is_button and event_type == 'multi_press_2' }}"
        sequence:
          - variables:
              mode: "{{ cfg[channel]['double'] }}"
          - choose:
              - conditions: "{{ mode == 'custom' }}"
                sequence:
                  - if: "{{ channel == 'ch1' }}"
                    then: !input double_action_ch1
                  - if: "{{ channel == 'ch2' }}"
                    then: !input double_action_ch2
                  - if: "{{ channel == 'ch3' }}"
                    then: !input double_action_ch3
              - conditions: "{{ func == 'light' }}"
                sequence:
                  - action: "light.{{ mode }}"
                    target:
                      entity_id: "{{ lights }}"
              - conditions: "{{ func == 'media' }}"
                sequence:
                  - action: "media_player.{{ mode }}"
                    continue_on_error: true
                    target:
                      entity_id: "{{ players }}"

      # ------------------------------------------------------ Dreifachklick
      - conditions: "{{ is_button and event_type == 'multi_press_3' }}"
        sequence:
          - if: "{{ channel == 'ch1' }}"
            then: !input triple_action_ch1
          - if: "{{ channel == 'ch2' }}"
            then: !input triple_action_ch2
          - if: "{{ channel == 'ch3' }}"
            then: !input triple_action_ch3

      # -------------------------------------------------------- Langer Druck
      - conditions: "{{ is_button and event_type == 'long_press' }}"
        sequence:
          - if: "{{ channel == 'ch1' }}"
            then: !input long_action_ch1
          - if: "{{ channel == 'ch2' }}"
            then: !input long_action_ch2
          - if: "{{ channel == 'ch3' }}"
            then: !input long_action_ch3

      # ------------------------------------------------------------- Drehrad
      - conditions: >-
          {{ not is_button and (
               (eval_mode == 'relaxed' and not is_ext)
               or (eval_mode == 'instant' and is_ext
                   and trigger.event.data.new_state.state == '1') ) }}
        sequence:
          - variables:
              scroll_direction: "{{ 'left' if trigger.id.startswith('left') else 'right' }}"
              scroll_clicks: >-
                {% if eval_mode == 'relaxed' %}
                  {{ trigger.event.data.new_state.attributes.totalNumberOfPressesCounted | int(1) }}
                {% else %}
                  1
                {% endif %}
          - choose:
              # ---- eigene Dreh-Aktion
              - conditions: "{{ wheel_mode == 'custom' }}"
                sequence:
                  - if: "{{ channel == 'ch1' }}"
                    then: !input wheel_action_ch1
                  - if: "{{ channel == 'ch2' }}"
                    then: !input wheel_action_ch2
                  - if: "{{ channel == 'ch3' }}"
                    then: !input wheel_action_ch3

              # ---- Sofort / Licht: läuft, solange das Rad gedreht wird
              # Der Sensor steht beim Drehen auf 1. Ein Lauf führt den Zielwert
              # selbst mit und setzt ihn absolut (kein Zurückspringen durch
              # verzögerte Lampenrückmeldungen). Keine Wartezeit nach dem Drehen.
              - conditions: >-
                  {{ eval_mode == 'instant' and func == 'light' and lights | count > 0
                     and (now() - trigger.event.time_fired).total_seconds() < 0.5 }}
                sequence:
                  - variables:
                      sensor: "{{ trigger.event.data.entity_id }}"
                      dirv: "{{ 1 if scroll_direction == 'right' else -1 }}"
                      tick: "{{ 100 / (light_ramp_time | float(1.5)) * 0.15 }}"
                      on_lights: "{{ lights | select('is_state', 'on') | list }}"
                      group: "{{ on_lights if on_lights | count > 0 else lights }}"
                      level: >-
                        {% set b = on_lights | map('state_attr', 'brightness')
                                   | select('number') | list %}
                        {{ 0 if on_lights | count == 0
                           else (((b | max) / 255 * 100) if b else 100) }}
                      stop: false
                  # ausgeschaltete Lampen nur durch Rechtsdrehen einschalten
                  - condition: template
                    value_template: "{{ on_lights | count > 0 or (dirv > 0 and light_turn_on) }}"
                  - repeat:
                      while: >-
                        {{ not stop and repeat.index <= 200 and (repeat.index == 1
                           or is_state(sensor, '1')
                           or (now() - states[sensor].last_changed).total_seconds() < 0.35) }}
                      sequence:
                        # in kurzen Meldelücken des Rads nur warten, nicht weiterregeln
                        - variables:
                            moving: "{{ repeat.index == 1 or is_state(sensor, '1') }}"
                            level: >-
                              {{ [[level + (dirv * tick if moving else 0), 0] | max, 100] | min }}
                        - choose:
                            - conditions: "{{ moving and level >= 1 }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ group }}"
                                  data:
                                    brightness_pct: "{{ level | round(0) | int }}"
                                    transition: 0.15
                            - conditions: "{{ moving and light_turn_off }}"
                              sequence:
                                - action: light.turn_off
                                  target:
                                    entity_id: "{{ group }}"
                            - conditions: "{{ moving }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ group }}"
                                  data:
                                    brightness_pct: 1
                        - variables:
                            stop: "{{ level >= 100 or level < 1 }}"
                        - delay:
                            milliseconds: 150

              # ---- Sofort / Media: gleiches Prinzip für die Lautstärke
              - conditions: >-
                  {{ eval_mode == 'instant' and func == 'media' and players | count > 0
                     and (now() - trigger.event.time_fired).total_seconds() < 0.5 }}
                sequence:
                  - variables:
                      sensor: "{{ trigger.event.data.entity_id }}"
                      dirv: "{{ 1 if scroll_direction == 'right' else -1 }}"
                      tick: "{{ (volume_max_pct | float(40)) / (media_ramp_time | float(1.5)) * 0.15 }}"
                      active: >-
                        {{ players | reject('is_state', ['off', 'standby', 'unavailable', 'unknown']) | list }}
                      level: >-
                        {% set v = active | map('state_attr', 'volume_level')
                                   | select('number') | list %}
                        {{ (v | max) * 100 if v else 0 }}
                      # nie lauter als das Maximum (eine höhere Ausgangslautstärke bleibt)
                      upper: "{{ [volume_max_pct | float(40), level] | max }}"
                      stop: false
                  - choose:
                      # alles aus -> durch Rechtsdrehen einschalten
                      - conditions: "{{ active | count == 0 }}"
                        sequence:
                          - if: "{{ dirv > 0 and media_turn_on }}"
                            then:
                              - action: media_player.turn_on
                                continue_on_error: true
                                target:
                                  entity_id: "{{ players }}"
                    default:
                      - repeat:
                          while: >-
                            {{ not stop and repeat.index <= 200 and (repeat.index == 1
                               or is_state(sensor, '1')
                               or (now() - states[sensor].last_changed).total_seconds() < 0.35) }}
                          sequence:
                            - variables:
                                moving: "{{ repeat.index == 1 or is_state(sensor, '1') }}"
                                level: >-
                                  {{ [[level + (dirv * tick if moving else 0), 0] | max, upper] | min }}
                            - choose:
                                - conditions: "{{ not moving }}"
                                  sequence:
                                    - delay:
                                        milliseconds: 50
                                - conditions: "{{ level >= 0.5 }}"
                                  sequence:
                                    - action: media_player.volume_set
                                      continue_on_error: true
                                      target:
                                        entity_id: "{{ active }}"
                                      data:
                                        volume_level: "{{ (level / 100) | round(3) }}"
                                - conditions: "{{ media_turn_off }}"
                                  sequence:
                                    - action: media_player.turn_off
                                      continue_on_error: true
                                      target:
                                        entity_id: "{{ active }}"
                              default:
                                - action: media_player.volume_set
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ active }}"
                                  data:
                                    volume_level: 0
                            - variables:
                                stop: "{{ level >= upper or level < 0.5 }}"
                            - delay:
                                milliseconds: 150

              # ---- Licht: Helligkeit
              # Wie im Original: ein Aufruf je Meldung des Rads, je Lampe relativ
              # zur aktuellen Helligkeit. Die Schrittweite ergibt sich aus der
              # gewünschten Anzahl Umdrehungen für 0–100 %.
              - conditions: "{{ func == 'light' and lights | count > 0 }}"
                sequence:
                  - variables:
                      step: "{{ 100 / ((light_turns | int(1)) * (clicks_per_turn | int(18))) }}"
                      change: "{{ step * (scroll_clicks | int(1)) * (1 if scroll_direction == 'right' else -1) }}"
                  - repeat:
                      for_each: "{{ lights }}"
                      sequence:
                        - variables:
                            is_on: "{{ is_state(repeat.item, 'on') }}"
                            current: >-
                              {{ ((state_attr(repeat.item, 'brightness') | int(255)) / 255 * 100)
                                 if is_on else 0 }}
                            new: "{{ [current + change, 100] | min }}"
                        - choose:
                            # aus und Rechtsdrehen -> dunkel einschalten
                            - conditions: "{{ not is_on and change > 0 and light_turn_on }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    brightness_pct: "{{ [new | round(0) | int, 1] | max }}"
                                    transition: "{{ light_transition }}"
                            # an und unter die kleinste Helligkeit -> aus (oder 1 %)
                            - conditions: "{{ is_on and new < 1 }}"
                              sequence:
                                - if: "{{ light_turn_off }}"
                                  then:
                                    - action: light.turn_off
                                      target:
                                        entity_id: "{{ repeat.item }}"
                                      data:
                                        transition: "{{ light_transition }}"
                                  else:
                                    - action: light.turn_on
                                      target:
                                        entity_id: "{{ repeat.item }}"
                                      data:
                                        brightness_pct: 1
                                        transition: "{{ light_transition }}"
                            # an -> heller / dunkler
                            - conditions: "{{ is_on }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ repeat.item }}"
                                  data:
                                    brightness_step_pct: "{{ change | round(1) }}"
                                    transition: "{{ light_transition }}"

              # ---- Media: Lautstärke (wie im Original über volume_set)
              - conditions: "{{ func == 'media' and players | count > 0 }}"
                sequence:
                  - variables:
                      step: >-
                        {{ (volume_max_pct | float(40))
                           / ((media_turns | int(1)) * (clicks_per_turn | int(18))) }}
                      change: "{{ step * (scroll_clicks | int(1)) * (1 if scroll_direction == 'right' else -1) }}"
                  - repeat:
                      for_each: "{{ players }}"
                      sequence:
                        - variables:
                            is_off: "{{ states(repeat.item) in ['off', 'standby', 'unavailable', 'unknown'] }}"
                            vol: "{{ (state_attr(repeat.item, 'volume_level') | float(0)) * 100 }}"
                            # nie lauter als das Maximum (eine höhere Ausgangslautstärke bleibt)
                            upper: "{{ [volume_max_pct | float(40), vol] | max }}"
                            new: "{{ [vol + change, upper] | min }}"
                        - choose:
                            # aus und Rechtsdrehen -> einschalten
                            - conditions: "{{ is_off }}"
                              sequence:
                                - if: "{{ change > 0 and media_turn_on }}"
                                  then:
                                    - action: media_player.turn_on
                                      continue_on_error: true
                                      target:
                                        entity_id: "{{ repeat.item }}"
                            # unter 0 -> aus (oder 0)
                            - conditions: "{{ new < 0.5 }}"
                              sequence:
                                - if: "{{ media_turn_off }}"
                                  then:
                                    - action: media_player.turn_off
                                      continue_on_error: true
                                      target:
                                        entity_id: "{{ repeat.item }}"
                                  else:
                                    - action: media_player.volume_set
                                      continue_on_error: true
                                      target:
                                        entity_id: "{{ repeat.item }}"
                                      data:
                                        volume_level: 0
                          default:
                            - action: media_player.volume_set
                              continue_on_error: true
                              target:
                                entity_id: "{{ repeat.item }}"
                              data:
                                volume_level: "{{ (new / 100) | round(3) }}"

# wie im Original: Meldungen werden nacheinander abgearbeitet
mode: queued
max: 10
max_exceeded: silent

variables:
  cfg:
    ch1:
      target: !input target_ch1
      wheel: !input wheel_mode_ch1
      click: !input click_mode_ch1
      double: !input double_mode_ch1
    ch2:
      target: !input target_ch2
      wheel: !input wheel_mode_ch2
      click: !input click_mode_ch2
      double: !input double_mode_ch2
    ch3:
      target: !input target_ch3
      wheel: !input wheel_mode_ch3
      click: !input click_mode_ch3
      double: !input double_mode_ch3
  eval_mode: !input eval_mode
  clicks_per_turn: !input clicks_per_turn
  light_turns: !input light_turns
  light_ramp_time: !input light_ramp_time
  light_turn_on: !input light_turn_on
  light_turn_off: !input light_turn_off
  light_transition: !input light_transition
  media_turns: !input media_turns
  media_ramp_time: !input media_ramp_time
  volume_max_pct: !input volume_max_pct
  media_turn_on: !input media_turn_on
  media_turn_off: !input media_turn_off

