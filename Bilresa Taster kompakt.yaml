---
blueprint:
  name: Bilresa Taster kompakt
  description: |
    Kompakter Blueprint für den **IKEA BILRESA Doppeltaster** (Matter).

    Es wird ein Hauptziel gewählt (Lampe, Media-Player, Schalter/Steckdose,
    Gerät oder Bereich), optional ein Zweitziel (Lampe oder Media-Player).
    Enthält ein Ziel mehreres, gilt der Vorrang Licht → Media → Schalter.

    **Ohne Zweitziel** steuert der Taster nur das Hauptziel:

    | | Taste AN | Taste AUS |
    |---|---|---|
    | Einfachklick | Stufe 1: gedimmt und warm (25 %) | schnell aus |
    | Doppelklick | Stufe 2: hell und kälter (75 %) | langsam aus (10 s) |
    | Dreifachklick | frei belegbar | frei belegbar |
    | Halten | heller / lauter | dunkler / leiser |

    **Mit Zweitziel** schaltet der Einfachklick das Hauptziel (z. B. eine
    Steckdose), alles andere wirkt auf das Zweitziel:

    | | Taste AN | Taste AUS |
    |---|---|---|
    | Einfachklick | Hauptziel an | Hauptziel aus |
    | Doppelklick | Zweitziel Stufe 1 | Zweitziel schnell aus |
    | Dreifachklick | Zweitziel Stufe 2 | Zweitziel langsam aus |
    | Halten | Zweitziel heller / lauter | Zweitziel dunkler / leiser |

    Media-Player werden statt der Stufen ein- bzw. ausgeschaltet, Halten regelt
    die Lautstärke bis zur eingestellten Obergrenze. Schalter kennen nur an/aus.
    Die frei belegbaren Dreifachklick-Aktionen laufen mit Zweitziel zusätzlich.
    Das Loslassen der Taste beendet nur das Dimmen und löst keine Aktion aus.

    Version: 2026-11-23a
  domain: automation
  homeassistant:
    min_version: 2025.4.0

  input:
    button_on:
      name: Taste AN
      description: Ereignis-Entität der Taste zum Einschalten / Heller (meist „Taste 1“).
      selector:
        entity:
          filter:
            - domain: event
              integration: matter
    button_off:
      name: Taste AUS
      description: Ereignis-Entität der Taste zum Ausschalten / Dunkler (meist „Taste 2“).
      selector:
        entity:
          filter:
            - domain: event
              integration: matter
    target:
      name: Hauptziel
      description: >-
        Lampe(n), Media-Player, Schalter/Steckdose, Gerät oder Bereich, das
        der Taster steuert. Mit Zweitziel schaltet nur der Einfachklick das
        Hauptziel an bzw. aus.
      default: {}
      selector:
        target:
          entity:
            - domain:
                - light
                - media_player
                - switch
                - input_boolean
                - fan
    secondary_target:
      name: Zweitziel (optional)
      description: >-
        Lampe(n) oder Media-Player für Doppelklick, Dreifachklick und Halten.
        Leer lassen, damit alles auf das Hauptziel wirkt.
      default: {}
      selector:
        target:
          entity:
            - domain:
                - light
                - media_player
    function:
      name: Funktion des Hauptziels
      description: >-
        „Automatisch“ wählt nach dem Hauptziel: Lampe → Licht,
        Media-Player → Media, sonst Schalter.
      default: auto
      selector:
        select:
          mode: dropdown
          options:
            - label: Automatisch (nach Ziel)
              value: auto
            - label: Licht
              value: light
            - label: Media
              value: media
            - label: Schalter / Steckdose
              value: switch
    triple_action_on:
      name: "Taste AN: Dreifachklick"
      description: Frei belegbare Aktion.
      default: []
      selector:
        action: {}
    triple_action_off:
      name: "Taste AUS: Dreifachklick"
      description: Frei belegbare Aktion.
      default: []
      selector:
        action: {}

    # ------------------------------------------------------ Licht-Vorgaben
    light_section:
      name: Licht – Vorgaben für Klicks
      description: >-
        Stufe 1 / schnell aus = Einfachklick (mit Zweitziel: Doppelklick).
        Stufe 2 / langsam aus = Doppelklick (mit Zweitziel: Dreifachklick).
      icon: mdi:lightbulb-on-outline
      collapsed: true
      input:
        single_brightness:
          name: "Stufe 1: Helligkeit"
          default: 25
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
              mode: slider
        single_kelvin:
          name: "Stufe 1: Farbtemperatur"
          description: Niedrig = warm, hoch = kalt.
          default: 2700
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500
        double_brightness:
          name: "Stufe 2: Helligkeit"
          default: 75
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
              mode: slider
        double_kelvin:
          name: "Stufe 2: Farbtemperatur"
          description: Niedrig = warm, hoch = kalt.
          default: 4000
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500
        fast_off:
          name: "Schnell aus: Ausschaltdauer"
          default: 0.5
          selector:
            number:
              min: 0
              max: 10
              step: 0.1
              unit_of_measurement: s
              mode: box
        slow_off:
          name: "Langsam aus: Ausschaltdauer"
          default: 10
          selector:
            number:
              min: 1
              max: 300
              step: 1
              unit_of_measurement: s
              mode: box

    # --------------------------------------------------------------- Halten
    hold_section:
      name: Halten – Helligkeit und Lautstärke
      icon: mdi:gesture-tap-hold
      collapsed: true
      input:
        ramp_time:
          name: Dauer für den vollen Bereich
          description: >-
            So lange dauert es beim Halten von 0 % bis 100 % Helligkeit
            bzw. von 0 bis zur maximalen Lautstärke.
          default: 4
          selector:
            number:
              min: 1
              max: 20
              step: 0.5
              unit_of_measurement: s
              mode: box
        volume_max_pct:
          name: Maximale Lautstärke
          description: Lauter als dieser Wert stellt der Taster nicht ein.
          default: 40
          selector:
            number:
              min: 5
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        hold_turn_on:
          name: Halten schaltet ein
          description: Halten der Taste AN schaltet ein ausgeschaltetes Ziel (dunkel beginnend) ein. Mit Zweitziel gilt Halten für das Zweitziel.
          default: true
          selector:
            boolean:
        hold_turn_off:
          name: Halten schaltet aus
          description: Halten der Taste AUS bis ganz unten schaltet das Ziel aus.
          default: true
          selector:
            boolean:

trigger:
  - trigger: state
    entity_id: !input button_on
    id: "on"
  - trigger: state
    entity_id: !input button_off
    id: "off"

condition:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.to_state is not none
         and trigger.from_state.state != 'unavailable'
         and trigger.to_state.state not in ['unavailable', 'unknown'] }}

action:
  - variables:
      is_on: "{{ trigger.id == 'on' }}"
      button: "{{ trigger.entity_id }}"
      event_type: "{{ trigger.to_state.attributes.event_type | default('') }}"
      # Haupt- und Zweitziel (Entität, Gerät, Bereich, Etage, Label) in
      # Entitäten auflösen -> [Hauptziel-Liste, Zweitziel-Liste]
      resolved: >-
        {% set out = namespace(l=[]) %}
        {% for t in [target, secondary_target] %}
          {% set ns = namespace(e=[]) %}
          {% if t is mapping %}
            {% for key in ['entity_id', 'device_id', 'area_id', 'floor_id', 'label_id'] %}
              {% set x = t.get(key) or [] %}
              {% for i in ([x] if x is string else x) %}
                {% if key == 'entity_id' %}
                  {% set ns.e = ns.e + [i] %}
                {% elif key == 'device_id' %}
                  {% set ns.e = ns.e + device_entities(i) | list %}
                {% elif key == 'area_id' %}
                  {% set ns.e = ns.e + area_entities(i) | list %}
                {% elif key == 'floor_id' %}
                  {% for a in floor_areas(i) %}
                    {% set ns.e = ns.e + area_entities(a) | list %}
                  {% endfor %}
                {% else %}
                  {% set ns.e = ns.e + label_entities(i) | list %}
                {% endif %}
              {% endfor %}
            {% endfor %}
          {% endif %}
          {% set out.l = out.l + [ns.e | unique | list] %}
        {% endfor %}
        {{ out.l }}
      main_lights: "{{ resolved[0] | select('match', 'light\\.') | list }}"
      main_players: "{{ resolved[0] | select('match', 'media_player\\.') | list }}"
      main_switches: >-
        {{ resolved[0] | select('match', '(switch|input_boolean|fan)\\.') | list }}
      sec_lights: "{{ resolved[1] | select('match', 'light\\.') | list }}"
      sec_players: "{{ resolved[1] | select('match', 'media_player\\.') | list }}"
      # Vorrang: Licht -> Media -> Schalter
      main_func: >-
        {% if function in ['light', 'media', 'switch'] %}
          {{ function }}
        {% elif main_lights | count > 0 %}
          light
        {% elif main_players | count > 0 %}
          media
        {% elif main_switches | count > 0 %}
          switch
        {% else %}
          none
        {% endif %}
      main_power: >-
        {{ {'light': main_lights, 'media': main_players,
            'switch': main_switches}.get(main_func, []) }}
      sec_func: >-
        {{ 'light' if sec_lights | count > 0
           else ('media' if sec_players | count > 0 else 'none') }}
      # Mit Zweitziel: Einfachklick = Hauptziel an/aus, Rest = Zweitziel
      shifted: "{{ sec_func != 'none' }}"
      press: >-
        {{ {'multi_press_1': 1, 'multi_press_2': 2,
            'multi_press_3': 3}.get(event_type, 0) }}
      power_click: "{{ shifted and press == 1 }}"
      # Stufe 1/2 (schnell/langsam aus); 0 = keine Stufe
      stage: >-
        {% set s = press - 1 if shifted else press %}
        {{ s if s in [1, 2] else 0 }}
      # Ziel für Stufen und Halten
      func: "{{ sec_func if shifted else main_func }}"
      lights: "{{ sec_lights if shifted else main_lights }}"
      players: "{{ sec_players if shifted else main_players }}"
      switches: "{{ [] if shifted else main_switches }}"

  - choose:
      # ------------------- Einfachklick mit Zweitziel: Hauptziel an / aus
      - conditions: "{{ power_click and main_power | count > 0 }}"
        sequence:
          - if: "{{ is_on }}"
            then:
              - action: homeassistant.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ main_power }}"
            else:
              - action: homeassistant.turn_off
                continue_on_error: true
                target:
                  entity_id: "{{ main_power }}"

      # ------------------------------------------------------ Stufe 1/2 AN
      - conditions: "{{ is_on and stage > 0 }}"
        sequence:
          - choose:
              - conditions: "{{ func == 'light' and lights | count > 0 }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: "{{ lights }}"
                    data:
                      brightness_pct: >-
                        {{ (single_brightness if stage == 1
                            else double_brightness) | int }}
                      color_temp_kelvin: >-
                        {{ (single_kelvin if stage == 1
                            else double_kelvin) | int }}
                      transition: 0.5
              - conditions: "{{ func == 'media' and players | count > 0 }}"
                sequence:
                  - action: media_player.turn_on
                    continue_on_error: true
                    target:
                      entity_id: "{{ players }}"
              - conditions: "{{ func == 'switch' and switches | count > 0 }}"
                sequence:
                  - action: homeassistant.turn_on
                    continue_on_error: true
                    target:
                      entity_id: "{{ switches }}"

      # --------------------------------------------------- Stufe 1/2 AUS
      - conditions: "{{ not is_on and stage > 0 }}"
        sequence:
          - choose:
              - conditions: "{{ func == 'light' and lights | count > 0 }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id: "{{ lights }}"
                    data:
                      transition: >-
                        {{ (fast_off if stage == 1 else slow_off) | float(0) }}
              - conditions: "{{ func == 'media' and players | count > 0 }}"
                sequence:
                  - action: media_player.turn_off
                    continue_on_error: true
                    target:
                      entity_id: "{{ players }}"
              - conditions: "{{ func == 'switch' and switches | count > 0 }}"
                sequence:
                  - action: homeassistant.turn_off
                    continue_on_error: true
                    target:
                      entity_id: "{{ switches }}"

      # ------------------------------------- Halten: Helligkeit / Lautstärke
      # Läuft, solange die Taste gehalten wird. Das Loslassen (long_release)
      # startet die Automation neu und beendet damit die Schleife.
      - conditions: "{{ event_type == 'long_press' }}"
        sequence:
          - choose:
              # ---- Licht: Zielwert wird im Lauf mitgeführt und absolut gesetzt
              - conditions: "{{ func == 'light' and lights | count > 0 }}"
                sequence:
                  - variables:
                      # Änderung pro Sekunde; der Zielwert folgt der Haltedauer, auch
                      # wenn ein Lampenbefehl länger braucht
                      rate: "{{ 100 / (ramp_time | float(4)) }}"
                      t0: "{{ as_timestamp(now()) }}"
                      on_lights: "{{ lights | select('is_state', 'on') | list }}"
                      group: "{{ on_lights if on_lights | count > 0 else lights }}"
                      # Startwert: hellste eingeschaltete Lampe in Prozent (aus = 0)
                      level: >-
                        {% set b = on_lights | map('state_attr', 'brightness')
                                   | select('number') | list %}
                        {{ 0 if on_lights | count == 0
                           else (((b | max) / 255 * 100) if b else 100) }}
                      start: "{{ level }}"
                      finished: false
                  # ausgeschaltete Lampen nur mit der Taste AN einschalten
                  - condition: template
                    value_template: >-
                      {{ on_lights | count > 0 or (is_on and hold_turn_on) }}
                  - repeat:
                      while: >-
                        {{ not finished and repeat.index <= 100
                           and state_attr(button, 'event_type') == 'long_press' }}
                      sequence:
                        - variables:
                            level: >-
                              {{ [[start + (1 if is_on else -1) * rate
                                   * (as_timestamp(now()) - t0 + 0.25), 0] | max, 100] | min }}
                        - choose:
                            - conditions: "{{ level >= 1 }}"
                              sequence:
                                - action: light.turn_on
                                  target:
                                    entity_id: "{{ group }}"
                                  data:
                                    brightness_pct: "{{ level | round(0) | int }}"
                                    transition: 0.25
                            - conditions: "{{ hold_turn_off }}"
                              sequence:
                                - action: light.turn_off
                                  target:
                                    entity_id: "{{ group }}"
                                  data:
                                    transition: 0.25
                          default:
                            - action: light.turn_on
                              target:
                                entity_id: "{{ group }}"
                              data:
                                brightness_pct: 1
                                transition: 0.25
                        - variables:
                            finished: "{{ level >= 100 or level < 1 }}"
                        - delay: 0.25

              # ---- Media: gleiches Prinzip für die Lautstärke
              - conditions: "{{ func == 'media' and players | count > 0 }}"
                sequence:
                  - variables:
                      rate: "{{ (volume_max_pct | float(40)) / (ramp_time | float(4)) }}"
                      t0: "{{ as_timestamp(now()) }}"
                      active: >-
                        {{ players | reject('is_state', ['off', 'standby', 'unavailable', 'unknown']) | list }}
                      # Startwert: lautester aktiver Player in Prozent
                      level: >-
                        {% set v = active | map('state_attr', 'volume_level')
                                   | select('number') | list %}
                        {{ (v | max) * 100 if v else 0 }}
                      # nie lauter als das Maximum (eine höhere Ausgangslautstärke bleibt)
                      upper: "{{ [volume_max_pct | float(40), level] | max }}"
                      start: "{{ level }}"
                      finished: false
                  - choose:
                      # alles aus -> mit der Taste AN einschalten
                      - conditions: "{{ active | count == 0 }}"
                        sequence:
                          - if: "{{ is_on and hold_turn_on }}"
                            then:
                              - action: media_player.turn_on
                                continue_on_error: true
                                target:
                                  entity_id: "{{ players }}"
                    default:
                      - repeat:
                          while: >-
                            {{ not finished and repeat.index <= 100
                               and state_attr(button, 'event_type') == 'long_press' }}
                          sequence:
                            - variables:
                                level: >-
                                  {{ [[start + (1 if is_on else -1) * rate
                                       * (as_timestamp(now()) - t0 + 0.25), 0] | max, upper] | min }}
                            - choose:
                                - conditions: "{{ level >= 0.5 }}"
                                  sequence:
                                    - action: media_player.volume_set
                                      continue_on_error: true
                                      target:
                                        entity_id: "{{ active }}"
                                      data:
                                        volume_level: "{{ (level / 100) | round(3) }}"
                                - conditions: "{{ hold_turn_off }}"
                                  sequence:
                                    - action: media_player.turn_off
                                      continue_on_error: true
                                      target:
                                        entity_id: "{{ active }}"
                              default:
                                - action: media_player.volume_set
                                  continue_on_error: true
                                  target:
                                    entity_id: "{{ active }}"
                                  data:
                                    volume_level: 0
                            - variables:
                                finished: "{{ level >= upper or level < 0.5 }}"
                            - delay: 0.25

  # ----------------------------- Dreifachklick: frei belegbare Aktionen
  # Laufen immer, mit Zweitziel zusätzlich zur Stufe 2.
  - if: "{{ press == 3 }}"
    then:
      - if: "{{ is_on }}"
        then: !input triple_action_on
        else: !input triple_action_off

# Neustart: jedes neue Ereignis (auch das Loslassen) beendet eine laufende
# Dimm-Schleife sofort.
mode: restart
max_exceeded: silent

variables:
  target: !input target
  secondary_target: !input secondary_target
  function: !input function
  single_brightness: !input single_brightness
  single_kelvin: !input single_kelvin
  double_brightness: !input double_brightness
  double_kelvin: !input double_kelvin
  fast_off: !input fast_off
  slow_off: !input slow_off
  ramp_time: !input ramp_time
  volume_max_pct: !input volume_max_pct
  hold_turn_on: !input hold_turn_on
  hold_turn_off: !input hold_turn_off
